<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Risk</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="public/data/images/favicon.png" />

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="public/css/style.css" />
</head>
<body>

    <!-- Navbar -->
    <header id="header">
        <h3 class="title">Substations in County Durham</h3>
        <nav id="header-links" aria-label="Site links">
            <a class="header-link github-link" href="https://github.com/Oscar-Ryley/Flood-Risk" aria-label="View Flood Risk on GitHub" title="View Flood Risk on GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5a9.5 9.5 0 0 0-3 18.51c.48.09.65-.21.65-.46v-1.68c-2.65.58-3.21-1.28-3.21-1.28-.44-1.12-1.07-1.42-1.07-1.42-.87-.6.07-.59.07-.59.96.07 1.47.99 1.47.99.86 1.47 2.25 1.05 2.8.8.09-.62.34-1.05.61-1.29-2.12-.24-4.35-1.06-4.35-4.7 0-1.04.37-1.89.98-2.55-.1-.24-.43-1.21.09-2.52 0 0 .8-.26 2.62.97A9.1 9.1 0 0 1 12 6.97c.81 0 1.62.11 2.38.32 1.82-1.23 2.62-.97 2.62-.97.52 1.31.19 2.28.09 2.52.61.66.98 1.51.98 2.55 0 3.65-2.23 4.46-4.36 4.7.35.3.65.87.65 1.76v2.7c0 .25.17.55.66.46A9.5 9.5 0 0 0 12 2.5Z"></path></svg>
            </a>
            <a class="header-link report-link" href="/report">Report</a>
        </nav>
        <div id="header-actions">
        <button id="recenter-map" type="button" aria-label="Recenter map on Durham" title="Recenter map on Durham">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.5"></circle><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"></path></svg>
        </button>
        <button id="classified-toggle" type="button" aria-pressed="false">Classified only</button>
        <details id="risk-settings">
            <summary>Settings</summary>
            <div class="settings-panel">
                <fieldset id="weight-settings">
                    <legend>Weights</legend>
                    <section id="weight-controls" aria-label="Risk score weights">
                        <div class="weight-control" data-weight="physical">
                            <label for="weight-physical">Physical <output>33%</output></label>
                            <input id="weight-physical" type="range" min="0" max="100" step="1" value="33">
                        </div>
                        <div class="weight-control" data-weight="terrain">
                            <label for="weight-terrain">Terrain <output>33%</output></label>
                            <input id="weight-terrain" type="range" min="0" max="100" step="1" value="33">
                        </div>
                        <div class="weight-control" data-weight="vulnerability">
                            <label for="weight-vulnerability">Vulnerability <output>0%</output></label>
                            <input id="weight-vulnerability" type="range" min="0" max="100" step="1" value="0" disabled>
                        </div>
                        <div class="weight-control" data-weight="consequence">
                            <label for="weight-consequence">Consequence <output>34%</output></label>
                            <input id="weight-consequence" type="range" min="0" max="100" step="1" value="34">
                        </div>
                    </section>
                </fieldset>
                <fieldset>
                    <legend>Vulnerability coefficient</legend>
                    <label>Pole mounted <input class="risk-setting" data-setting="poleMounted" type="number" min="0" max="1" step="0.05" value="0.5"></label>
                    <label>Ground mounted <input class="risk-setting" data-setting="groundMounted" type="number" min="0" max="1" step="0.05" value="0.5"></label>
                </fieldset>
                <fieldset>
                    <legend>Hazard thresholds</legend>
                    <label>Low <input class="risk-setting" data-setting="lowThreshold" type="number" min="0" step="0.05" value="0"></label>
                    <label>Moderate <input class="risk-setting" data-setting="moderateThreshold" type="number" min="0" step="0.05" value="0.75"></label>
                    <label>Significant <input class="risk-setting" data-setting="significantThreshold" type="number" min="0" step="0.05" value="1.25"></label>
                    <label>Extreme <input class="risk-setting" data-setting="extremeThreshold" type="number" min="0" step="0.05" value="2.5"></label>
                </fieldset>
                <fieldset>
                    <legend>Climate multiplier</legend>
                    <label>Percentage increase <input class="risk-setting" data-setting="climateIncrease" type="number" min="0" step="1" value="0">%</label>
                </fieldset>
            </div>
        </details>
        <span id="counter" class="badge-container">Loading Map...</span>
        </div>
    </header>

    <!-- Map Container -->
    <main id="map"></main>

    <!-- Third-Party JS Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script src="public/scripts/app.js"></script>

</body>
</html>
